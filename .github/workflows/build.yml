name: Build NT Newstamil App (APK & AAB for Play Store)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK (For Direct Phone Testing)
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB for Google Play Store)
        run: flutter build appbundle --release

      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: NewsTamil-Testing-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: NewsTamil-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
