name: Build NT Newstamil App (APK & AAB for Play Store)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean & Fix Configuration
        run: |
          rm -f android/local.properties
          rm -f android/build.gradle
          rm -f android/app/build.gradle

          # 1. Versions matching modern Flutter SDK
          sed -i 's/gradle-.*-all.zip/gradle-9.3.1-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "9.1.0"/g' android/settings.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.4.0"/g' android/settings.gradle.kts
          sed -i 's/project.evaluationDependsOn(":app")/\/\/ project.evaluationDependsOn(":app")/g' android/build.gradle.kts

          # 2. Use the pre-installed NDK version on GitHub runner (ZERO download needed)
          sed -i 's/.*ndkVersion.*/    ndkVersion = "27.3.13750724"/g' android/app/build.gradle.kts
          sudo ln -sf /usr/local/lib/android/sdk/ndk/27.3.13750724 /usr/local/lib/android/sdk/ndk/28.2.13676358 2>/dev/null || true

          # 3. Safe memory settings for 7GB GitHub runner
          sed -i 's/-Xmx8G/-Xmx4G/g' android/gradle.properties
          sed -i 's/-XX:MaxMetaspaceSize=4G/-XX:MaxMetaspaceSize=1G/g' android/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Dependencies & Patch ProGuard Compatibility
        run: |
          flutter pub get
          find /home/runner/.pub-cache -name "build.gradle*" -exec sed -i "s/proguard-android\.txt/proguard-android-optimize\.txt/g" {} + || true

      - name: Build Release APK (For Direct Phone Testing)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB for Google Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: NewsTamil-Testing-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: NewsTamil-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
